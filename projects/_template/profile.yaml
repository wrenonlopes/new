# Project profile. The only thing that changes between projects.
# Copy this folder to projects/<name>/, fill every field, then run /audit <name>.
# Leave a field empty rather than guessing; engines report "unknown" for missing data.

name: ""                      # folder name, e.g. estateium
domain: ""                    # e.g. estateium.ae
key_urls: []                  # homepage, service pages, top converters (full URLs)

market:
  regions: []                 # e.g. [Dubai, GCC]
  languages: []               # e.g. [en, ar]

audience: ""                  # who searches and what problem they are solving

conversions: []               # e.g. [{name: Enquiry form, url: /contact}, {name: WhatsApp}, {name: Call}]
success_metric: ""            # the one number this project is judged on, e.g. qualified enquiries per month

competitors: []               # 3 to 5 domains

brand:
  names: []                   # brand name and aliases, used to detect AI mentions

buyer_prompts: []             # questions buyers ask AI assistants, in their words

data_access:
  search_console: ""          # property, e.g. sc-domain:example.com
  ga4_property: ""            # numeric property ID
  bing_webmaster: ""          # verified site URL
  dataforseo: false           # true once credentials are in .env
  keyword_planner: false      # true if a Google Ads account is available

stack:
  cms: ""                     # CMS or framework, e.g. Next.js, WordPress
  rendering: ""               # ssr | ssg | csr | hybrid; csr pages fail the raw-HTML rule
  repo: ""                    # where fixes are made, if we have access

approval:
  approver: ""                # who signs off before anything publishes
