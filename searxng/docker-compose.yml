# Fallback SERP snapshots. Localhost only; not a ranking source of truth.
# Start: docker compose -f searxng/docker-compose.yml up -d
# Query: curl "http://127.0.0.1:8888/search?q=QUERY&format=json"
services:
  searxng:
    image: searxng/searxng:2026.9.25-12f8b6515
    ports:
      - "127.0.0.1:8888:8080"
    volumes:
      - ./settings.yml:/etc/searxng/settings.yml:ro
    restart: unless-stopped
