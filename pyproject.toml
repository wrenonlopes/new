[project]
name = "seo-system-engines"
version = "0.1.0"
description = "Engines for the SEO + AI search visibility system"
requires-python = ">=3.12"
dependencies = [
    "crawl4ai==0.9.4",
    "google-genai==2.25.0",
    "pyyaml==6.0.3",
]

[tool.uv]
package = false
# Intel Macs: cryptography >=49 ships no x86_64 macOS wheel (source build needs Rust).
constraint-dependencies = ["cryptography<49"]
